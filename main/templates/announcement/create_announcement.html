{% extends "main/base.html" %}
{% block title %}Create Announcement{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
  <div class="card shadow p-4">
    <h3 class="mb-3">Create New Announcement</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          {{ field.label_tag }}
          {{ field }}
          {% for error in field.errors %}
            <div class="text-danger small">{{ error }}</div>
          {% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-success w-100">Create Announcement</button>
    </form>
  </div>
</div>
{% endblock %}
