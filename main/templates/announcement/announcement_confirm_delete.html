{% extends "main/base.html" %}
{% block title %}Delete Announcement{% endblock %}

{% block content %}
<div class="container mt-5 text-center">
  <div class="card shadow p-4">
    <h4>Are you sure you want to delete this announcement?</h4>
    <p class="text-danger fw-bold">"{{ announcement.title }}"</p>

    <form method="post">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-3 mt-3">
        <a href="{% url 'main:dashboard' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
