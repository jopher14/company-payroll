services:
  - type: web
    name: company-payroll
    env: python
    plan: free

    buildCommand: |
      # ---- Build React Frontend ----
      cd frontend
      npm install
      npm run build
      cd ..

      # ---- Build Django Backend ----
      pip install -r requirements.txt
      python manage.py collectstatic --noinput

    startCommand: gunicorn company_payroll.wsgi:application

    postDeployCommand: |
      echo "🚀 Running Django migrations..."
      python manage.py migrate --noinput

    envVars:
      - key: DEBUG
        value: False
      - key: DJANGO_SETTINGS_MODULE
        value: company_payroll.settings
      - key: PYTHON_VERSION
        value: 3.13
