services:
  - type: web
    name: company-payroll
    env: python
    plan: free

    # ---------------- Build ----------------
    buildCommand: |
      set -e
      echo "📦 Installing Python dependencies..."
      pip install --upgrade pip
      pip install -r requirements.txt

      echo "🧱 Collecting Django static files..."
      python manage.py collectstatic --noinput

      FRONTEND_DIR="frontend"
      if [ -d "$FRONTEND_DIR" ]; then
        echo "➡️ Building React frontend..."
        cd "$FRONTEND_DIR"
        npm ci || npm install
        npm run build
        echo "📁 Copying React build into Django static folder..."
        mkdir -p static
        cp -r "$FRONTEND_DIR/build/"* static/
      else
        echo "⚠️ No frontend directory found, skipping React build."
      fi

    # ---------------- Start ----------------
    startCommand: gunicorn company.wsgi:application

    # ---------------- Post Deploy ----------------
    postDeployCommand: |
      echo "🚀 Running Django migrations..."
      python manage.py migrate --noinput

    # ---------------- Environment Variables ----------------
    envVars:
      - key: DEBUG
        value: False
      - key: DJANGO_SETTINGS_MODULE
        value: company.settings
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://company-payroll.vercel.app
