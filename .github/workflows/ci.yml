name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Django Backend Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Show installed packages (for debugging)
      - name: Show installed packages
        run: pip list

      # Step 5: Run migrations
      - name: Run migrations
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      # Step 6: Run Django tests
      - name: Run Django tests
        run: |
          python manage.py test || pytest

  frontend-build:
    name: Node.js Frontend Build
    runs-on: ubuntu-latest
    needs: backend-tests  # Run only if backend tests pass

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3: Install and build frontend
      - name: Install dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
