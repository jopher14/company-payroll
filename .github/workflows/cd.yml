name: CD Pipeline - Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python (for Django)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run backend migrations and tests (optional but recommended)
      - name: Run Django checks
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate
          python manage.py test || echo "Skipping tests"

      # 5️⃣ Set up Node.js (for frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 6️⃣ Build React frontend
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm install react-scripts --save
          npm run build

      # 7️⃣ Move React build into Django static folder
      - name: Move React build into Django
        run: |
          rm -rf backend/static/*
          cp -r frontend/build/* backend/static/

      # 8️⃣ Deploy to Render
      - name: Trigger Render deploy
        uses: render-oss/action-deploy@v1
        with:
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}
