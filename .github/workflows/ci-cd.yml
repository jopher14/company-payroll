name: CI/CD Pipeline - Django + React + Render

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------- 🧪 BACKEND TESTS ----------
  backend-tests:
    name: Django Backend Tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install backend dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Run migrations (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Run Django tests
        run: python manage.py test || pytest

  # ---------- ⚛️ FRONTEND BUILD ----------
  frontend-build:
    name: React Frontend Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: backend-tests
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm ci
          npm install react-scripts --save

      - name: Install frontend dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npm ci
          npm install react-scripts --save

      - name: Build React App
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  # ---------- 🚀 DEPLOY TO RENDER ----------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy React build into Django static folder
        run: |
          mkdir -p backend/static
          rm -rf backend/static/*
          cp -r frontend/build/* backend/static/

      - name: Trigger Render deploy
        uses: render-examples/deploy-action@v1
        with:
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}
