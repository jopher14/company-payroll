{% extends "main/base.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 600px;">
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-header bg-dark text-white d-flex align-items-center">
      <i class="bi bi-cash-stack me-2"></i>
      <h5 class="mb-0">📝 Generate Payroll</h5>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}

        <!-- Pay Period Selection -->
        <div class="mb-4">
          <label for="period" class="form-label fw-semibold">Select Pay Period</label>
          <select name="period" id="period" class="form-select shadow-sm" required>
            <option value="" disabled selected>-- Choose Period --</option>
            <option value="first_half">1st Half (1–15)</option>
            <option value="second_half">2nd Half (16–End)</option>
          </select>
          <div class="form-text text-muted">
            Payroll will be computed based on the selected period.
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-between">
          <a href="{% url 'main:dashboard' %}" class="btn btn-light shadow-sm border rounded px-3 py-2">
            <i class="bi bi-arrow-left-circle me-1"></i> Cancel
          </a>
          <a href="{% url 'payroll:payroll_list' %}" class="btn btn-light shadow-sm border rounded px-3 py-2">
            <i class="bi bi-list me-1"></i> Payroll List
          </a>
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check2-circle"></i> Generate Payroll
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
{% endblock %}
