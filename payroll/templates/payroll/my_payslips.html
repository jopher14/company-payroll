{% extends "main/base.html" %}
{% block title %}My Payslips{% endblock %}

{% block content %}
<div class="container mt-5">
    <h3>My Payslips</h3>
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Month</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for payslip in payslips %}
            <tr>
                <td>{{ payslip.month|date:"F Y" }}</td>
                <td>
                    <a href="{% url 'payroll:view_payslip' payslip.id %}" class="btn btn-sm btn-primary">View</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center">No payslips found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'main:dashboard' %}" class="btn btn-secondary mb-3">Back</a>
</div>
{% endblock %}
