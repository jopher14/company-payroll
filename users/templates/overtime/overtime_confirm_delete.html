{% extends "main/base.html" %}

{% block title %}Delete Overtime{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Delete Overtime Request</h3>
    <p>Are you sure you want to delete the overtime request on <strong>{{ overtime.date }}</strong> for <strong>{{ overtime.hours }} hours</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'users:my_pending_overtime' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
