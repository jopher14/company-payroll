{% extends "main/base.html" %}
{% load static %}

{% block title %}Employee Management{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Employee Management</h2>
    <a href="{% url 'users:register' %}" class="btn btn-success">
      <i class="bi bi-person-plus"></i> Register Employee
    </a>
  </div>

  <div id="employee-react-table"></div>

  <a href="{% url 'main:dashboard' %}" class="btn btn-outline-dark mt-3">Back</a>
</div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Django → React data -->
<script type="application/json" id="employee-data">
    {{ employees_json|safe }}
</script>

<!-- Load external React code -->
<script src="{% static 'js/employee_table.js' %}" type="text/babel"></script>

{% endblock %}
