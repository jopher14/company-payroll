{% extends "main/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width: 420px; width: 100%;">
    
    <!-- Card Header -->
    <div class="text-center mb-4">
      <div class="bg-primary text-white rounded-circle d-inline-flex justify-content-center align-items-center" style="width:60px; height:60px;">
        <i class="bi bi-person-lock fs-3"></i>
      </div>
      <h3 class="mt-3">Welcome Back</h3>
      <p class="text-muted small">Please sign in with your credentials</p>
    </div>


    <!-- Login Form -->
    <form method="post" novalidate>
      {% csrf_token %}

      <div class="form-floating mb-3">
        <input type="text" class="form-control" name="employee_id" id="employee_id" placeholder="Employee ID" required>
        <label for="employee_id">Employee ID</label>
      </div>

      <div class="form-floating mb-3">
        <input type="text" class="form-control" name="username" id="username" placeholder="Username" required autofocus>
        <label for="username">Username</label>
      </div>

      <div class="form-floating mb-3 position-relative">
        <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
        <label for="password">Password</label>
        <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor:pointer;" onclick="togglePassword()">
          <i class="bi bi-eye" id="togglePasswordIcon"></i>
        </span>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Login</button>
    </form>

    <!-- Footer -->
    <div class="mt-4 text-center">
    {% if user.is_authenticated and user.role == "human_resources" %}
        <small class="text-muted">
        Want to add a new employee? 
        <a href="{% url 'register' %}" class="text-decoration-none">Register</a>
        </small>
    {% endif %}
    </div>
  </div>
</div>

<!-- Password Toggle Script -->
<script>
function togglePassword() {
  const passwordField = document.getElementById("password");
  const icon = document.getElementById("togglePasswordIcon");
  if (passwordField.type === "password") {
    passwordField.type = "text";
    icon.classList.remove("bi-eye");
    icon.classList.add("bi-eye-slash");
  } else {
    passwordField.type = "password";
    icon.classList.remove("bi-eye-slash");
    icon.classList.add("bi-eye");
  }
}
</script>
{% endblock %}
