{% extends "main/base.html" %}

{% block title %}Logged Out{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow p-4 text-center" style="max-width: 500px; width: 100%; border-radius: 12px;">
    <h3 class="mb-3">You have been logged out</h3>
    <p class="text-muted">Thank you for visiting. You have successfully logged out of your account.</p>
    <a href="{% url 'users:login' %}" class="btn btn-primary mt-3 w-100">Login Again</a>
  </div>
</div>
{% endblock %}
