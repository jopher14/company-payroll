{% extends "main/base.html" %}
{% block content %}
<div class="container mt-5 text-center">
  <h4>Are you sure you want to delete team "<strong>{{ team.name }}</strong>"?</h4>
  <form method="POST" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'users:team_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
