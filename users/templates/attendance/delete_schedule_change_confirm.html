{% extends "main/base.html" %}

{% block title %}Delete Schedule Change Request{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <div class="card-header bg-danger text-white d-flex align-items-center">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <h5 class="mb-0">Confirm Deletion</h5>
        </div>
        <div class="card-body shadow-lg">
            <p class="lead">
                Are you sure you want to delete this schedule change request scheduled on
                <strong>{{ object.date }}</strong>?
            </p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger flex-grow-1">
                    <i class="bi bi-trash"></i> Yes, Delete
                </button>
                <a href="{% url 'users:my_pending_schedule_change' %}" class="btn btn-outline-secondary flex-grow-1">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
