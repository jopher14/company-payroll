{% extends "main/base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="card p-4 shadow">
    <h5>Are you sure you want to delete this leave request?</h5>
    <p>{{ leave.start_date }} → {{ leave.end_date }} ({{ leave.reason }})</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'my_leaves' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
